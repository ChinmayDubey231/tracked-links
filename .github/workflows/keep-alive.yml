# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking it
# takes about a minute: too long for a recruiter opening a link. This pings /health every
# 10 minutes to keep it awake. Set the repository variable API_URL to the Render address
# (Settings > Secrets and variables > Actions > Variables) to turn it on.
#
# Only during the day: 02:00-18:59 UTC is about 7:30 am to 12:30 am in India. That is about
# 530 hours a month, which leaves room in the 750 free hours Render gives a whole workspace
# for other free services. Awake all day would use about 744.
name: Keep the API awake

on:
  schedule:
    - cron: '*/10 2-18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL is not set, so there is nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "${API_URL%/}/health"
