<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Tracked Links design reference</title>
<!-- Static design reference exported from the Tracked Links canvas. All numbers, names and emails are sample data. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B5301D}a:hover{color:#8A2314}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #176B58;outline-offset:2px}
</style>
</head>
<body>
<div style="min-height: 800px; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #101418; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<section style="flex: 1 1 420px; min-width: 0; box-sizing: border-box; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 408px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-weight: 600; font-size: 40px; line-height: 1.2">Log in</h1>
<p style="margin: 0; color: #4A5460">Pick up where your links left off.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="signin-email" style="font-weight: 600; font-size: 14px">Email</label>
<input id="signin-email" type="email" placeholder="you@example.com" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid #C5CCD6; border-radius: 8px; background: #FFFFFF; color: #101418; font: 400 15px 'Plus Jakarta Sans', system-ui, sans-serif">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="signin-password" style="font-weight: 600; font-size: 14px">Password</label>
<input id="signin-password" type="password" placeholder="At least 8 characters" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid #C5CCD6; border-radius: 8px; background: #FFFFFF; color: #101418; font: 400 15px 'Plus Jakarta Sans', system-ui, sans-serif">
</div>
<a href="documents.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 8px; background: #176B58; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">Log in</a>
</form>
<p style="margin: 0; color: #4A5460">New here? <a href="#signup" style="font-weight: 600; text-decoration: none">Create an account</a></p>
</div>
</section>
<section style="flex: 1 1 420px; min-width: 0; box-sizing: border-box; padding: 56px; background: #123C33; color: #F2F4F7; display: flex; flex-direction: column; justify-content: center; gap: 36px">
<h2 style="margin: 0; max-width: 520px; font-weight: 600; font-size: 40px; line-height: 1.3; text-wrap: balance">Know when your resume gets opened, and how far it gets read.</h2>
<div aria-hidden="true" style="max-width: 420px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 1 / 1.414; background: #FFFFFF; position: relative; overflow: hidden"><div style="position: absolute; inset: 0; background: #D9402B; opacity: 0.6"></div></div><span style="font-weight: 600; font-size: 24px; line-height: 1.2">48s</span></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 1 / 1.414; background: #FFFFFF; position: relative; overflow: hidden"><div style="position: absolute; inset: 0; background: #D9402B; opacity: 0.38"></div></div><span style="font-weight: 600; font-size: 24px; line-height: 1.2">31s</span></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 1 / 1.414; background: #FFFFFF; position: relative; overflow: hidden"><div style="position: absolute; inset: 0; background: #D9402B; opacity: 0.2"></div></div><span style="font-weight: 600; font-size: 24px; line-height: 1.2">16s</span></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="aspect-ratio: 1 / 1.414; background: #FFFFFF; position: relative; overflow: hidden"><div style="position: absolute; inset: 0; background: #D9402B; opacity: 0.08"></div></div><span style="font-weight: 600; font-size: 24px; line-height: 1.2">7s</span></div>
</div>
<p style="margin: 0; max-width: 520px; font-size: 16px; color: #D7E6E0">Upload a PDF, make one link per place you share it, and see reading time page by page.</p>
</section>
</div>
</body>
</html>
