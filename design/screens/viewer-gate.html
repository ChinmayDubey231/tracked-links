<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer gate | Tracked Links design reference</title>
<!-- Static design reference exported from the Tracked Links canvas. All numbers, names and emails are sample data. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#155B4B}a:hover{color:#0E4337}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #176B58;outline-offset:2px}
</style>
</head>
<body>
<div style="min-height: 960px; display: flex; flex-direction: column; background: #F6F8FA; color: #101418; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<header style="background: #FFFFFF; border-bottom: 1px solid #E3E7EC">
<div style="max-width: 1160px; margin: 0 auto; box-sizing: border-box; padding: 12px 24px; min-height: 78px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<span style="display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: #15171A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#176B58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5l5-5"></path><path d="M11 6.5l1.2-1.2a4 4 0 0 1 5.7 5.7l-1.2 1.2"></path><path d="M12.5 17.5l-1.2 1.2a4 4 0 0 1-5.7-5.7l1.2-1.2"></path><path d="M17 21v-2"></path><path d="M20.5 21v-4.5"></path></svg>Tracked Links</span>
<span style="color: #4A5460; font-size: 13px">Shared document</span>
</div>
</header>
<div style="flex: 1 0 auto; box-sizing: border-box; padding: 48px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 64px">
<div aria-hidden="true" style="flex: 0 1 220px; aspect-ratio: 1 / 1.414; background: #FFFFFF; border: 1px solid #C5CCD6; box-shadow: 0 12px 28px rgba(16, 20, 24, 0.1); box-sizing: border-box; padding: 30px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 10px; width: 55%; background: #101418; opacity: 0.55"></div>
<div style="height: 5px; width: 90%; background: #101418; opacity: 0.3"></div>
<div style="height: 5px; width: 82%; background: #101418; opacity: 0.3"></div>
<div style="height: 5px; width: 88%; background: #101418; opacity: 0.3"></div>
<div style="height: 5px; width: 60%; background: #101418; opacity: 0.3"></div>
<div style="height: 5px; width: 34%; background: #101418; opacity: 0.3"></div>
<div style="height: 5px; width: 86%; background: #101418; opacity: 0.3"></div>
<div style="height: 5px; width: 74%; background: #101418; opacity: 0.3"></div>
</div>
<main style="flex: 0 1 480px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="color: #4A5460">Chinmay Dubey shared a document with you</span>
<h1 style="margin: 0; font-weight: 600; font-size: 28px; line-height: 1.25; overflow-wrap: anywhere">Resume and projects.pdf</h1>
<span style="color: #4A5460">4 pages</span>
</div>
<form style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="gate-email" style="font-weight: 600; font-size: 14px">Your email</label>
<input id="gate-email" type="email" placeholder="name@company.com" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid #C5CCD6; border-radius: 8px; background: #FFFFFF; color: #101418; font: 400 15px 'Plus Jakarta Sans', system-ui, sans-serif">
<span style="color: #4A5460; font-size: 14px">The owner asked for an email before showing this document.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="gate-password" style="font-weight: 600; font-size: 14px">Password</label>
<input id="gate-password" type="password" placeholder="Sent to you with the link" style="box-sizing: border-box; width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid #C5CCD6; border-radius: 8px; background: #FFFFFF; color: #101418; font: 400 15px 'Plus Jakarta Sans', system-ui, sans-serif">
</div>
<a href="viewer.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 8px; background: #176B58; color: #FFFFFF; font-weight: 600; font-size: 14px; text-decoration: none">View document</a>
</form>
<p style="margin: 0; color: #4A5460; font-size: 14px">This document tracks views and reading time.</p>
</main>
</div>
<footer style="background: #FFFFFF; border-top: 1px solid #E3E7EC">
<div style="max-width: 1160px; margin: 0 auto; box-sizing: border-box; padding: 16px 24px; min-height: 76px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px"><span style="font-weight: 600; font-size: 13px; color: #155B4B">Tracked Links</span><span style="font-size: 12px; color: #4A5460">Views and reading time are recorded</span></span>
<nav style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px"><a href="#help" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; color: #4A5460; text-decoration: none">Help</a><a href="#privacy" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; color: #4A5460; text-decoration: none">Privacy</a><a href="#terms" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; color: #4A5460; text-decoration: none">Terms</a></nav>
</div>
</footer>
</div>
</body>
</html>
